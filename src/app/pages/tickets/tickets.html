<style>
  .tickets-header {
    margin-bottom: 1.25rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .tickets-title {
    font-size: 1.6rem;
    font-weight: 650;
    color: #0f172a;
    margin: 0;
  }

  .tickets-subtitle {
    margin: 0.25rem 0 0;
    font-size: 0.9rem;
    color: #64748b;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 14px 35px rgba(15, 23, 42, 0.12);
  }

  .filters {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;
    gap: 0.75rem;
    align-items: end;
    margin-bottom: 1rem;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 0.35rem;
  }

  .w-full,
  .w-full input,
  .w-full textarea {
    width: 100%;
    box-sizing: border-box;
  }

  .actions {
    display: flex;
    gap: 0.5rem;
  }

  @media (max-width: 900px) {
    .filters {
      grid-template-columns: 1fr;
    }
  }
</style>

<header class="tickets-header">
  <div>
    <h1 class="tickets-title">Tickets</h1>
    <p class="tickets-subtitle">CRUD de tickets con filtros y orden.</p>
  </div>

  <button pButton type="button" label="Nuevo ticket" icon="pi pi-plus" (click)="nuevo()"></button>
</header>

<section class="card">
  <div class="filters">
    <div class="field">
      <label>Búsqueda</label>
      <input
        pInputText
        class="w-full"
        [ngModel]="query()"
        (ngModelChange)="query.set(($event ?? '').toString())"
        placeholder="Título, descripción, asignado, grupo..."
      />
    </div>

    <div class="field">
      <label>Grupo</label>
      <p-select
        class="w-full"
        [options]="groupFilterOptions()"
        [ngModel]="selectedGroupId()"
        (ngModelChange)="selectedGroupId.set($event)"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        placeholder="Todos"
      ></p-select>
    </div>

    <div class="field">
      <label>Status</label>
      <p-select
        class="w-full"
        [options]="statusFilterOptions()"
        [ngModel]="statusFilter()"
        (ngModelChange)="statusFilter.set($event)"
        optionLabel="label"
        optionValue="value"
      ></p-select>
    </div>

    <div class="field">
      <label>Prioridad</label>
      <p-select
        class="w-full"
        [options]="priorityFilterOptions()"
        [ngModel]="priorityFilter()"
        (ngModelChange)="priorityFilter.set($event)"
        optionLabel="label"
        optionValue="value"
      ></p-select>
    </div>

    <div class="field">
      <label>Orden</label>
      <p-select
        class="w-full"
        [options]="sortOptions()"
        [ngModel]="sortKey()"
        (ngModelChange)="sortKey.set($event)"
        optionLabel="label"
        optionValue="value"
      ></p-select>
    </div>
  </div>

  <p-table [value]="filteredTickets()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]">
    <ng-template pTemplate="header">
      <tr>
        <th>Título</th>
        <th>Grupo</th>
        <th>Status</th>
        <th>Prioridad</th>
        <th>Asignado a</th>
        <th>Creación</th>
        <th>Fecha límite</th>
        <th style="width: 170px"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-t>
      <tr>
        <td style="max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.titulo }}</td>
        <td>{{ groupName(t.groupId) }}</td>
        <td><p-tag [value]="t.estado" [severity]="statusSeverity(t.estado)"></p-tag></td>
        <td><p-tag [value]="t.prioridad" [severity]="prioritySeverity(t.prioridad)"></p-tag></td>
        <td style="max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.asignadoA }}</td>
        <td>{{ formatDate(t.createdAt) }}</td>
        <td>{{ formatDate(t.fechaLimite) }}</td>
        <td>
          <div class="actions">
            <button pButton type="button" icon="pi pi-eye" severity="secondary" (click)="ver(t)"></button>
            <button pButton type="button" icon="pi pi-pencil" severity="secondary" (click)="editar(t)"></button>
            <button pButton type="button" icon="pi pi-trash" severity="danger" (click)="eliminar(t)"></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" style="color: #64748b">No hay tickets aún. Crea uno con “Nuevo ticket”.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<p-dialog
  header="{{ editing() ? 'Editar ticket' : 'Nuevo ticket' }}"
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: 'min(820px, 95vw)' }"
>
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem">
      <div class="field">
        <label>Grupo</label>
        <p-select
          class="w-full"
          [options]="groupOptions()"
          formControlName="groupId"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona un grupo"
        ></p-select>
      </div>

      <div class="field">
        <label>Status</label>
        <p-select
          class="w-full"
          [options]="statusOptions"
          formControlName="estado"
        ></p-select>
      </div>

      <div class="field" style="grid-column: span 2">
        <label>Título</label>
        <input pInputText class="w-full" formControlName="titulo" placeholder="Título del ticket" />
      </div>

      <div class="field" style="grid-column: span 2">
        <label>Descripción</label>
        <textarea pTextarea class="w-full" rows="3" formControlName="descripcion" placeholder="Describe el problema"></textarea>
      </div>

      <div class="field">
        <label>Asignado a</label>
        <input pInputText class="w-full" formControlName="asignadoA" placeholder="email o usuario" />
      </div>

      <div class="field">
        <label>Prioridad</label>
        <p-select
          class="w-full"
          [options]="priorityOptions"
          formControlName="prioridad"
        ></p-select>
      </div>

      <div class="field">
        <label>Fecha de creación</label>
        <input
          pInputText
          class="w-full"
          [disabled]="true"
          [value]="editing() ? formatDate(editing()!.createdAt) : formatDate(now)"
        />
      </div>

      <div class="field">
        <label>Fecha límite</label>
        <p-datepicker
          class="w-full"
          formControlName="fechaLimite"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
        ></p-datepicker>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem">
      <button pButton type="button" label="Cancelar" severity="secondary" (click)="dialogVisible = false"></button>
      <button pButton type="submit" label="Guardar"></button>
    </div>
  </form>
</p-dialog>
